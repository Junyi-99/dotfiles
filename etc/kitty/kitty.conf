# ==============================================================================
#  kitty.conf  —  https://sw.kovidgoyal.net/kitty/conf/
#  完整默认配置参考: ./kitty.conf.default-reference
#  改完保存即生效（kitty 默认开启 config 自动重载），或按 ctrl+cmd+, 手动重载
# ==============================================================================


# ─── 字体 ──────────────────────────────────────────────────────────────────────
# Maple Mono NF CN: 等宽 + Nerd Font 图标 + 中英 2:1 对齐 + 圆润连字
font_family      family="Maple Mono NF CN" style=Regular
bold_font        family="Maple Mono NF CN" style=Bold
italic_font      family="Maple Mono NF CN" style=Italic
bold_italic_font family="Maple Mono NF CN" style="Bold Italic"
font_size        14.0

# 连字：正常显示，但光标停在连字上时拆开，方便看清光标位置
disable_ligatures cursor

# macOS 上默认字重偏细。第一个数字提亮暗底文字，第二个是 gamma。
# 觉得太粗/太细就微调这两个数，或者整行删掉回到 platform 默认。
text_composition_strategy 1.4 30

# 曲线下划线（LSP 报错波浪线）画得更清楚
undercurl_style thick-dense

# 行距/字距微调（正数变宽）。默认 0，想更宽松可以设 modify_font cell_height 110%
# modify_font cell_height 105%


# ─── 配色 ──────────────────────────────────────────────────────────────────────
# 跟随 macOS 明暗自动切换（kitty 0.38+）。
# 检测到 dark-theme.auto.conf / light-theme.auto.conf 就会自动启用，无需 include。
#   深色 = Catppuccin Mocha   浅色 = Catppuccin Latte
# 想换主题：kitten themes  （交互式，最后一步选 save as dark/light）

# MiniLED 纯黑：必须完全不透明，否则背景会透出别的窗口/桌面，背光分区就无法关闭
background_opacity        1.0
background_blur           0
# 锁死透明度：禁止运行时用快捷键改，避免误触破坏纯黑
dynamic_background_opacity no

# 匹配 ghostty 里的 window-colorspace=display-p3。
# 想要色彩更"准"（Catppuccin 原始设计值）就改成 srgb。
macos_colorspace displayp3


# ─── 光标 ──────────────────────────────────────────────────────────────────────
cursor_shape                block
cursor_blink_interval       0
cursor_stop_blinking_after  15.0

# 光标拖尾动画：已关闭（0 = 不画拖尾）
cursor_trail                 0


# ─── 窗口外观 ──────────────────────────────────────────────────────────────────
window_padding_width        8 10
placement_strategy          center
remember_window_size        yes
initial_window_width        180c
initial_window_height       48c

# 使用 macOS 原生窗口装饰（标题栏、圆角和红黄绿窗口按钮）
hide_window_decorations     no
macos_titlebar_color        system
macos_show_window_title_in  window

# 交给主题文件
active_border_color   none
inactive_text_alpha   0.85
window_resize_step_cells 2
window_resize_step_lines 2

enabled_layouts splits:split_axis=horizontal,stack


# ─── 标签栏 ────────────────────────────────────────────────────────────────────
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_activity_symbol     " ●"
active_tab_font_style   bold
tab_title_template      "{index}: {tab.active_exe}{' ' + tab.active_wd.split('/')[-1] if tab.active_wd else ''}"


# ─── 滚动 & 分页器 ─────────────────────────────────────────────────────────────
scrollback_lines            20000
# MB，供 pager 回溯的额外历史
scrollback_pager_history_size 64
touch_scroll_multiplier     2.0
wheel_scroll_multiplier     3.0


# ─── URL / 鼠标 ────────────────────────────────────────────────────────────────
detect_urls        yes
url_style          curly
open_url_with      default
underline_hyperlinks hover

copy_on_select     clipboard
mouse_hide_wait    2.0
strip_trailing_spaces smart
select_by_word_characters @-./_~?&=%+#

# 粘贴保护：URL 自动加引号、含控制字符时先确认
paste_actions quote-urls-at-prompt,confirm,confirm-if-large


# ─── Shell 集成 ────────────────────────────────────────────────────────────────
# 提供：跳转上/下一条命令、把上条命令输出丢进分页器、光标随 vi 模式变形、sudo 保持环境
shell_integration enabled

# 长命令跑完且窗口没焦点时发系统通知（超过 15 秒才提醒）
notify_on_cmd_finish unfocused 15.0 notify focus next

# ctrl+shift+enter 克隆当前窗口（含 cwd / venv / 环境变量）
allow_cloning ask


# ─── 远程控制 ──────────────────────────────────────────────────────────────────
# socket-only：只接受 unix socket 上的控制请求，不接受 TTY（SSH 进来的程序控制不了本地 kitty）
# kitty 会给窗口内注入 KITTY_LISTEN_ON，所以直接 `kitty @ ls` 就能用
allow_remote_control socket-only
listen_on unix:/tmp/kitty


# ─── 性能 ──────────────────────────────────────────────────────────────────────
# ~120fps
repaint_delay     8
input_delay       2
sync_to_monitor   yes


# ─── 提示音 ────────────────────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.08
visual_bell_color    none
window_alert_on_bell yes
bell_on_tab          "🔔 "


# ─── 终端类型 & 杂项 ───────────────────────────────────────────────────────────
term                 xterm-kitty
shell                .
editor               nvim
update_check_interval 0
confirm_os_window_close 0
close_on_child_death  no

macos_option_as_alt              yes
macos_quit_when_last_window_closed no
macos_traditional_fullscreen     no

clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask


# ==============================================================================
#  快捷键
#  kitty 默认的 leader 是 ctrl+shift；下面额外加了一套 macOS 风格的 cmd 绑定
# ==============================================================================

# ── 窗口分屏（对齐你 ghostty 的习惯）
map cmd+d               launch --location=vsplit --cwd=current
map cmd+shift+d         launch --location=hsplit --cwd=current
map cmd+w               close_window
map cmd+shift+enter     toggle_fullscreen

# Shift+Enter 发 ESC+CR（等同 Alt+Enter），Claude Code 把它当换行。
# kitty 不支持 xterm modifyOtherKeys，tmux 里 Shift+Enter 否则就是普通 \r；
# ESC+CR 不依赖 tmux extended-keys，也不依赖程序有没有请求扩展键
map shift+enter         send_text all \x1b\r
# 临时把当前窗口全屏放大
map cmd+enter           toggle_layout stack

# ── 窗口导航
map cmd+alt+left        neighboring_window left
map cmd+alt+right       neighboring_window right
map cmd+alt+up          neighboring_window up
map cmd+alt+down        neighboring_window down
map cmd+[               previous_window
map cmd+]               next_window
map cmd+shift+left      move_window left
map cmd+shift+right     move_window right
map cmd+shift+up        move_window up
map cmd+shift+down      move_window down

# ── 窗口尺寸
map cmd+ctrl+left       resize_window narrower
map cmd+ctrl+right      resize_window wider
map cmd+ctrl+up         resize_window taller
map cmd+ctrl+down       resize_window shorter
map cmd+ctrl+0          resize_window reset

# ── 标签页
map cmd+t               new_tab_with_cwd
map cmd+shift+w         close_tab
map cmd+shift+]         next_tab
map cmd+shift+[         previous_tab
map cmd+shift+r         set_tab_title

# ── 字号
map cmd+plus            change_font_size all +1.0
map cmd+equal           change_font_size all +1.0
map cmd+minus           change_font_size all -1.0
map cmd+0               change_font_size all 0

# ── 透明度（dynamic_background_opacity 已开）
map cmd+ctrl+plus       set_background_opacity +0.05
map cmd+ctrl+minus      set_background_opacity -0.05
map cmd+ctrl+backspace  set_background_opacity default

# ── Shell 集成：命令级跳转 / 查看输出
map cmd+up              scroll_to_prompt -1
map cmd+down            scroll_to_prompt 1
map cmd+shift+g         show_last_command_output
map cmd+shift+h         show_scrollback

# ── kitten 生态（kitty 相对其他终端最值钱的部分）
# 键盘选取并打开屏幕上的 URL / 路径 / 行号 / 哈希
map cmd+shift+e         open_url_with_hints
map cmd+shift+o>f       kitten hints --type path --program -
map cmd+shift+o>l       kitten hints --type line --program -
map cmd+shift+o>w       kitten hints --type word --program -
map cmd+shift+o>h       kitten hints --type hash --program -
# 用 editor 打开 file:line
map cmd+shift+o>n       kitten hints --type linenum

# 命令面板：忘了快捷键就按这个，模糊搜索所有 kitty 动作
map cmd+shift+p         command_palette

# Unicode / emoji 输入
map cmd+ctrl+space      kitten unicode_input

# 把输入广播到所有窗口（多机运维好用）
map cmd+shift+b         launch --allow-remote-control kitty +kitten broadcast

# 编辑本配置文件
map cmd+comma           edit_config_file
map ctrl+cmd+comma      load_config_file

# 调试当前配置/字体（排查渲染问题）
map cmd+shift+delete    debug_config


# ── 剪贴板
map cmd+c               copy_to_clipboard
map cmd+v               paste_from_clipboard
map cmd+shift+v         paste_from_selection

# ── 搜索回滚区（用 $PAGER 打开，可正则）
map cmd+f               show_scrollback

# ── 鼠标：cmd+点击打开链接
mouse_map cmd+left      release grabbed,ungrabbed mouse_handle_click link
