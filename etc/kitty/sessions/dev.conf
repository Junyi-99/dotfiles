# 开发会话布局：  kitty --session ~/.config/kitty/sessions/dev.conf
# 也可以在 kitty.conf 里设 startup_session sessions/dev.conf 让它每次启动都用

new_tab code
layout splits
cd ~
launch --title editor nvim
launch --location=vsplit --title shell

new_tab logs
layout stack
cd ~
launch --title logs

focus_matching_window title:editor
