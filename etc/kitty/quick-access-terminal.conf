# Quake 式下拉终端  (kitten quick-access-terminal)
# 绑定全局快捷键的方法见文末。

# 高度（行）；也可写 40% 或 600px
lines             28
columns           100
edge              top
layer             overlay

background_opacity 0.90
# 点别处自动收起
hide_on_focus_loss yes
start_as_hidden    no

margin_top        0
margin_left       0

# 下拉窗口单独覆盖一些 kitty 设置（不影响主窗口）
kitty_override    font_size=15
kitty_override    tab_bar_style=hidden
kitty_override    confirm_os_window_close=0
kitty_override    macos_quit_when_last_window_closed=no

# ── 绑定全局快捷键 (macOS) ─────────────────────────────────────────────
# 1. 先在任意终端跑一次：  kitten quick-access-terminal
#    窗口出现后再跑一次（或按 ctrl+d）让它隐藏 —— 这一步会向系统注册 Service
# 2. 系统设置 → 键盘 → 键盘快捷键 → 服务 → 通用
#    找到 “Quick access to kitty”，勾选并设置快捷键（例如 ⌥Space）
