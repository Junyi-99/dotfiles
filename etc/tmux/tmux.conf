# ============================================
# Professional tmux Configuration
# ============================================

# --- 基础设置 ---

# 前缀键改为 Ctrl+a（更顺手）
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 真彩色支持
set -g default-terminal "tmux-256color"
set -s terminal-overrides ",xterm-256color:RGB"

# 减少 escape 延迟（对 vim/neovim 用户至关重要）
set -sg escape-time 0

# 增大历史缓冲区
set -g history-limit 50000

# 窗口和面板编号从 1 开始
set -g base-index 1
setw -g pane-base-index 1

# 关闭窗口后自动重新编号
set -g renumber-windows on

# 启用鼠标支持（滚动、选择面板、调整大小）
set -g mouse on

# 使用 vi 模式
setw -g mode-keys vi

# 聚焦事件传递（neovim 需要）
set -g focus-events on

# 单 pane 窗口时窗口名跟随 pane title，多 pane 时回落到当前命令
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{==:#{window_panes},1},#{pane_title},#{pane_current_command}}'

# --- 快捷键 ---

# 重新加载配置
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display-message "Config reloaded!"

# 更直观的分屏快捷键
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 新窗口保留当前路径；大写 C / N 打开命名弹窗
bind c new-window -c "#{pane_current_path}"
bind C display-popup -E -w 64 -h 14 -x C -y C -T " New window " -d "#{pane_current_path}" '$XDG_CONFIG_HOME/tmux/new-window-prompt.sh window'
bind N display-popup -E -w 64 -h 14 -x C -y C -T " New session " -d "#{pane_current_path}" '$XDG_CONFIG_HOME/tmux/new-window-prompt.sh session'

# vim 风格面板切换
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + 方向键切换面板（无需前缀）
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift + 方向键切换窗口（无需前缀）
bind -n S-Right next-window

# 面板大小调整（前缀 + HJKL）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 复制模式改进（vi 风格）
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# 快速切换上一个窗口
bind Space last-window

# 侧边栏（prefix + b 切换，prefix + B 指定宽度）
bind b run-shell "~/.tmux/sidebar.sh"
bind B command-prompt -p "Sidebar width:" "run-shell '~/.tmux/sidebar.sh %%'"

# 鼠标点击状态栏左侧 session 名称 → 显示 session 列表
bind -n MouseDown1StatusLeft choose-tree -s

# 右键点击状态栏左侧 session 名称 → Session 菜单
bind -n MouseDown3StatusLeft display-menu -T "#[bold] Session " -x M -y S \
  "  + New Session"                        c "display-popup -E -w 64 -h 14 -x C -y C -T ' New session ' -d '#{pane_current_path}' '$XDG_CONFIG_HOME/tmux/new-window-prompt.sh session'" \
  "  ⇄ Switch Session"                     s "choose-tree -s" \
  "  ← Previous Session"                   p "switch-client -p" \
  "  → Next Session"                       n "switch-client -n" \
  "  ✎ Rename Session"                     R "command-prompt -p 'Rename:' 'rename-session %%'" \
  "" \
  "  ⏏ Detach"                             d "detach-client"

# 同步面板输入（广播模式）
bind S setw synchronize-panes \; display-message "Synchronize #{?synchronize-panes,ON,OFF}"

# 右键菜单
bind -n MouseDown3Pane display-menu -T "#[bold] Pane " -x M -y M \
  "─ Split"                                "" "" \
  "  ↔ Horizontal"                         h "split-window -h -c '#{pane_current_path}'" \
  "  ↕ Vertical"                           v "split-window -v -c '#{pane_current_path}'" \
  "" \
  "─ Toggle"                               "" "" \
  "#{?synchronize-panes,  ● Sync Panes,  ○ Sync Panes}" S "setw synchronize-panes" \
  "#{?window_zoomed_flag,  ● Zoom,  ○ Zoom}"             z "resize-pane -Z" \
  "" \
  "─ Move"                                 "" "" \
  "  ↑ Swap Up"                            u "swap-pane -U" \
  "  ↓ Swap Down"                          d "swap-pane -D" \
  "  ⎋ Break to Window"                    b "break-pane" \
  "  ⎘ Join from..."                       j "choose-window 'join-pane -s %%'" \
  "  → Send to..."                         s "choose-window 'join-pane -t %%'" \
  "" \
  "─ Layout"                               "" "" \
  "  ▦ Tiled"                              t "select-layout tiled" \
  "  ⬌ Even Horizontal"                    H "select-layout even-horizontal" \
  "  ⬍ Even Vertical"                      V "select-layout even-vertical" \
  "" \
  "─ Sidebar"                              "" "" \
  "#{?@sidebar_pane,  ● Sidebar,  ○ Sidebar}" b "run-shell '~/.tmux/sidebar.sh'" \
  "" \
  "─ Tools"                                "" "" \
  "  # Pane Numbers"                       q "display-panes" \
  "  ⌨ Key Bindings"                       k "list-keys" \
  "  ⏲ Clock"                              T "clock-mode" \
  "" \
  "─ Clipboard"                            "" "" \
  "  ≡ Choose Buffer"                      p "choose-buffer" \
  "" \
  "  ✕ Kill Pane"                          x "confirm-before -p 'Kill pane? (y/n)' kill-pane"

# 左键点击窗口列表末尾的 + 按钮 → 弹出浮层输入名字新建窗口；点其他窗口 tab 保持切换
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},newwin}" \
  "display-popup -E -w 64 -h 14 -x C -y C -T ' New window ' -d '#{pane_current_path}' '$XDG_CONFIG_HOME/tmux/new-window-prompt.sh window'" \
  "switch-client -t ="

# 右键点击状态栏 → 窗口/Session 菜单
bind -n MouseDown3Status display-menu -T "#[bold] Window " -x M -y S \
  "  + New Window"                         n "new-window -c '#{pane_current_path}'" \
  "  ✎ Rename Window"                      r "command-prompt -p 'Rename:' 'rename-window %%'" \
  "  ✕ Kill Window"                        x "confirm-before -p 'Kill window? (y/n)' kill-window"

# --- 状态栏 ---

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 50
set -g display-time 2000
setw -g window-status-separator " "

# --- 主题：自动检测 macOS Light/Dark ---

# 启动时自动检测并应用主题
run-shell "$XDG_CONFIG_HOME/tmux/apply-theme.sh"

# 手动切换主题快捷键
bind T run-shell "$XDG_CONFIG_HOME/tmux/apply-theme.sh" \; display-message "Theme refreshed!"

# --- 其他 ---

# attach 时仅刷新主题，避免每次创建 session 重复加载整份配置
set-hook -g client-attached 'run-shell "$XDG_CONFIG_HOME/tmux/apply-theme.sh"'
set-hook -gu session-created

# 活动监控
setw -g monitor-activity on
set -g visual-activity off

# 后台窗口有活动时，加 bell 通知（终端会闪烁/发声）
set -g monitor-bell on
set -g visual-bell on
set -g bell-action other

# 把子进程从 tmux server 的 namespace 重新接入到当前用户的 Aqua session
if-shell "command -v reattach-to-user-namespace" "set-option -g default-command 'reattach-to-user-namespace -l ${SHELL}'"

# 扩展键序列支持（Claude Code 的 Shift+Enter 换行需要）
set -s extended-keys on
set -s terminal-features 'xterm*:RGB:extkeys,*:hyperlinks'

bind f display-popup -E -x C -y C -w 80% -h 80% -d "#{pane_current_path}"
